<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reelogue</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="site">
    <div class="wrap nav">
      <a href="#/" class="brand">Ree<b>logue</b></a>
      <nav class="nav-links" id="navLinks">
        <a href="#/" data-route="">Главная</a>
        <a href="#/popular" data-route="popular">Популярное</a>
        <a href="#/feed" data-route="feed">Лента</a>
        <a href="#/lists" data-route="lists">Списки</a>
      </nav>
      <div class="nav-spacer"></div>
      <div class="searchbox">
        <input type="text" id="search" placeholder="Поиск фильмов и сериалов…" autocomplete="off" />
        <div class="search-results" id="searchResults"></div>
      </div>
      <a class="avatar-btn" id="meBtn" href="#"></a>
    </div>
  </header>

  <main id="app" class="wrap"><div class="loader">Загрузка…</div></main>

  <footer class="site">
    <div class="wrap">Ree<b>logue</b> — ваш личный кинодневник · данные © TMDB</div>
  </footer>

  <div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
  <div class="toast" id="toast"></div>

  <script src="/js/app.js"></script>
</body>
</html>
